display_information:
  name: "J — Sovereign Shards"
  description: "AI assistant and developer agent for Sovereign Shards, with chat, code review, and slash-command workflows."
  background_color: "#1D1F29"

features:
  bot_user:
    display_name: "J"
    always_online: true

  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    deep_linking_enabled: true

  slash_commands:
    - command: "/j"
      url: "https://example.com/slack/commands"
      description: "Invoke J for review, explain, test, plan, or general AI assistance."
      usage_hint: "review | explain <file> | test <file> | plan <feature>"
      should_escape: false

  shortcuts:
    - name: "Ask J"
      type: global
      callback_id: "j_global_shortcut"
      description: "Open J in Slack for a quick AI assistant request."
    - name: "Review with J"
      type: message
      callback_id: "j_message_shortcut"
      description: "Ask J to review or explain the selected message or code snippet."

oauth_config:
  scopes:
    bot:
      - app_mention:read
      - chat:write
      - chat:write.public
      - commands
      - im:history
      - mpim:history
      - channels:history
      - groups:history
      - channels:read
      - groups:read
      - mpim:read
      - im:read
      - users:read
      - users:read.email

settings:
  event_subscriptions:
    request_url: "https://example.com/slack/events"
    bot_events:
      - app_home_opened
      - message.im
      - app_mention
      - message.channels
      - message.groups
      - message.mpim
  interactivity:
    is_enabled: true
    request_url: "https://example.com/slack/interactivity"
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
