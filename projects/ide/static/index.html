<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovereign IDE</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
  <div class="ide">
    <header class="menu-bar">
      <div class="menu-item" data-action="openFile">File</div>
      <div class="menu-item" data-action="commandPalette">Edit</div>
      <div class="menu-item" data-action="toggleExplorer">View</div>
      <div class="menu-item" data-action="toggleExtensions">Help</div>
    </header>

    <div class="main-container">
      <aside class="activity-bar">
        <div class="activity-item" data-view="explorer" title="Explorer">
          <svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 2h4v4H3V2m5 0h4v4H8V2m5 0h4v4h-4V2M3 8h4v4H3V8m5 0h4v4H8V8m5 0h4v4h-4V8M3 14h4v4H3v-4m5 0h4v4H8v-4m5 0h4v4h-4v-4z" fill="currentColor"/></svg>
        </div>
        <div class="activity-item" data-view="search" title="Search">
          <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="2"/></svg>
        </div>
        <div class="activity-item" data-view="chat" title="Chat">
          <svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 3h12a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H7l-4 4V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </div>
        <div class="activity-item" data-view="scm" title="Source Control">
          <svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2C5.58 2 2 5.58 2 10s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8m0 14c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z" fill="currentColor"/></svg>
        </div>
        <div class="activity-item" data-view="debug" title="Debug">
          <svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2c4.4 0 8 3.6 8 8s-3.6 8-8 8-8-3.6-8-8 3.6-8 8-8m0 2c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6z" fill="currentColor"/></svg>
        </div>
        <div class="activity-item" data-view="extensions" title="Extensions">
          <svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 1l3 6h6l-5 3.5 2 6.5L10 14 5 17l2-6.5L2 7h6l3-6z" fill="currentColor"/></svg>
        </div>
        <div class="activity-item" data-view="market" title="Marketplace">
          <svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 5h12v10H4V5zm1 1v8h10V6H5zm3 1h4v2H8V7zm0 3h4v2H8v-2z" fill="currentColor"/></svg>
        </div>
      </aside>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2 id="sidebarTitle">Explorer</h2>
          <button id="sidebarToggle" title="Toggle Sidebar">⟨</button>
        </div>
        <div class="sidebar-content" id="sidebarContent"></div>
      </aside>

      <section class="editor-area">
        <div class="tab-bar" id="tabBar"></div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div id="editorContainer" class="editor-container"></div>
      </section>
    </div>

    <footer class="status-bar">
      <div class="status-left">
        <span id="gitStatus"></span>
      </div>
      <div class="status-right">
        <span id="editorStats"></span>
      </div>
    </footer>

    <div id="commandPalette" class="command-palette hidden">
      <input id="commandInput" placeholder=">" />
      <div id="commandResults" class="command-results"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
